name = "released-web"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Static assets (self-hosted Geist fonts under /fonts/*.woff2).
# Keeps visitor IPs on our edge instead of googleapis/gstatic.
[assets]
directory = "./public"

# Set with: wrangler secret put GITHUB_TOKEN
# This is the SHARED server-side token. PAT-paste is per-user via X-User-Github-Token header.

# GitLab federation secrets (set via `wrangler secret put`):
#   GITLAB_TOKEN                       — gitlab.com PAT. Used for gitlab.com ONLY;
#                                        it is never sent to other instances
#                                        (GitLab PATs are instance-scoped — a
#                                        gitlab.com token 401s elsewhere and
#                                        leaks the secret to a third-party host).
#   GITLAB_TOKEN_GITLAB_GNOME_ORG      — per-host PAT (host uppercased, '.' '-' → '_')
#   GITLAB_TOKEN_GITLAB_FREEDESKTOP_ORG
#   ...etc
# A host with no matching per-host secret falls back to anonymous. Anonymous
# calls from Workers share the edge IP's budget and exhaust quickly, so set a
# per-host PAT for any instance you expect meaningful federation traffic to.

# Vars (non-secret config).
#   ANUBIS_HOSTS       — hosts routed through the relay container (below). These
#                        sit behind Anubis, which challenges workerd's TLS
#                        fingerprint; the relay (Node) gets through. An empty
#                        string disables the relay. Defaults are baked into
#                        src/relay.ts; set here to make it auditable + adjustable.
#   EXTRA_GITLAB_HOSTS — extend the known-GitLab-hosts allowlist with self-hosted
#                        instances, e.g. "git.example.com,gitlab.acme.net".
#   PROD_HOST          — the canonical production hostname. Analytics are recorded
#                        ONLY for requests that arrive on this host, so Cloudflare
#                        per-version Preview URLs (which share this Worker's
#                        ANALYTICS binding) don't pollute the released_events
#                        dataset the maintaining loop reads back. Unset ⇒ record
#                        everything. See isProdRequest() in src/analytics.ts.
[vars]
ANUBIS_HOSTS = "gitlab.freedesktop.org,gitlab.gnome.org"
PROD_HOST = "released.blabberate.com"
# EXTRA_GITLAB_HOSTS = "git.example.com,gitlab.acme.net"

# Version metadata: exposes the deployed version's id/tag/timestamp at runtime
# (env.CF_VERSION_METADATA), surfaced read-only at GET /version so the
# maintaining loop can confirm which version is live. Populated automatically on
# every deploy; absent in `wrangler dev` and tests (the route degrades to nulls).
[version_metadata]
binding = "CF_VERSION_METADATA"

# Anubis-bypass relay container.
# gitlab.freedesktop.org / gitlab.gnome.org sit behind Anubis (techaro.lol),
# which fingerprints the caller's TLS/HTTP2 stack BELOW the API-auth layer and
# challenges workerd. Node's fingerprint (the CLI) is not. This container runs
# that same Node fetch, so the Worker can relay blocked-host API calls through
# it. The Worker still runs the whole findRelease algorithm; the container only
# ferries raw upstream bytes, gated by RELAY_SECRET + an SSRF allowlist.
# Source: container/ + src/relay.ts.
#
# One-time setup:
#   wrangler secret put RELAY_SECRET            # shared Worker↔container secret
# CI note: the Cloudflare API token used by release.yml must include the
#   Containers (Cloudchamber) edit permission, and the deploy runner needs Docker
#   (GitHub-hosted ubuntu runners have it) to build the image.
[[containers]]
class_name = "GitlabRelay"
image = "./Dockerfile"
name = "released-gitlab-relay"
max_instances = 1

[[durable_objects.bindings]]
class_name = "GitlabRelay"
name = "RELAY"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GitlabRelay"]

# Usage tracking (server-side, no client JS). One data point per request; see
# src/analytics.ts for the schema and scripts/stats.mjs for the queries. The
# dataset is created automatically on first write — no manual provisioning.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "released_events"

# ─────────────────────────────────────────────────────────────────────────────
# Preview environment — an ISOLATED preview Worker (issue #70).
#
# Why isolated, not a per-version Preview URL: Cloudflare does not generate
# Preview URLs for a Worker that implements a Durable Object (the GitlabRelay
# relay), so released-web can't use shared per-version previews. A separately-
# named Worker has its own secret store + bindings, so a preview deploy can
# never touch prod creds (the football #110 class).
#
# Bindings are NON-INHERITABLE in a named env — top-level bindings do not carry
# into [env.preview] — so each binding the preview needs is re-declared here,
# pointed at isolated/preview-scoped resources.
#
# The relay ships DORMANT in preview: ANUBIS_HOSTS is empty below, so
# makeRelayFetch() short-circuits and env.RELAY is never accessed (src/relay.ts);
# with no RELAY_SECRET the container is never spawned. Federated GitLab lookups
# (freedesktop/GNOME) degrade to the "use the CLI" card instead. The DO + image
# are still re-declared (preview-scoped names) because GitlabRelay is exported
# from the entry, so the preview workflow still builds the image (as prod CI
# does) even though it is never invoked.
# Deployed from .github/workflows/preview.yml (web first, then web-og-preview,
# which service-binds to this Worker).
[env.preview]
name = "released-web-preview"

[env.preview.vars]
# Relay OFF in preview (no RELAY_SECRET/container). Only federated GitLab hosts
# are affected; GitHub lookups, permalinks, result cards, OG render all work.
ANUBIS_HOSTS = ""
# Same prod-host guard as prod. Analytics write only fires on the prod host, and
# the preview host (released-web-preview.<sub>.workers.dev) never equals it, so
# the preview never writes the prod released_events dataset. See isProdRequest()
# in src/analytics.ts. The analytics binding below is isolated regardless.
PROD_HOST = "released.blabberate.com"
# Cache origin + canonical URLs for THIS deployment. Without it the /internal/*
# endpoints web-og calls fall back to PROD_HOST above and key the result cache on
# a host the preview Worker does not serve. Must stay the preview Worker's own
# URL (name above + the account's workers.dev subdomain).
#
# NOTE: this does NOT make preview a place the #143 cache alignment can be
# exercised. Cloudflare documents Cache API operations as functional only for
# Workers on custom domains, so on a *.workers.dev preview neither the public
# routes nor /internal ever warm a slot, and a second unfurl still pays a full
# lookup however the origins line up. The alignment is proven by the unit tests
# (test/internal-cache-origin.test.ts) and only takes effect on the prod custom
# domain. The var is still correct to set: it keeps preview off the prod key
# namespace and drives canonical URLs.
#
# COUPLING: this var has a SECOND effect. `publicBaseUrl()` (src/env.ts) prefers
# it over the incoming request origin, so preview's canonical links, `og:url` and
# every `pubBase`-derived href come from this literal rather than being correct by
# construction. The `[env.preview] name` half of that is guarded: on a workers.dev
# host the first label IS the Worker name, and `cacheOriginProblems`
# (test/internal-cache-origin.test.ts) fails the build when the two drift, so a
# rename cannot silently leave this line behind. The ACCOUNT subdomain half is not
# guardable from this file — `.lukaso.workers.dev` appears nowhere else in it — so
# deploying under a different account still needs this line updated by hand.
PUBLIC_BASE_URL = "https://released-web-preview.lukaso.workers.dev"

[env.preview.assets]
directory = "./public"

[env.preview.version_metadata]
binding = "CF_VERSION_METADATA"

# Dormant relay (preview-scoped names; never invoked — see ANUBIS_HOSTS above).
[[env.preview.containers]]
class_name = "GitlabRelay"
image = "./Dockerfile"
name = "released-gitlab-relay-preview"
max_instances = 1

[[env.preview.durable_objects.bindings]]
class_name = "GitlabRelay"
name = "RELAY"

[[env.preview.migrations]]
tag = "v1"
new_sqlite_classes = ["GitlabRelay"]

# Isolated dataset (belt-and-suspenders: isProdRequest already blocks the write).
[[env.preview.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "released_events_preview"

# Once web-og is deployed, uncomment to give web-og a service binding to this Worker:
# (configured FROM web-og's wrangler.toml — see packages/web-og/wrangler.toml)
